kind = "web"
previewPath = "/"
title = "Dattatreya M K — Portfolio"
version = "1.0.0"
id = "artifacts/dattatreya-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22843

[services.development]
run = "pnpm --filter @workspace/dattatreya-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dattatreya-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/dattatreya-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22843"
BASE_PATH = "/"
